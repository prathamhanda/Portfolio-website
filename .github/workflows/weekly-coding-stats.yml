name: Weekly Coding Stats Update

# One weekly trigger for every coding-stats artifact on the portfolio.
#
# History: there used to be two workflows here. "weekly-codolio-stats.yml" ran
# on Sundays and "coding-stats.yml" ran daily, and BOTH committed
# public/codolio-stats.json. The daily one wrote rank: 0 / streak: 0 and
# replaced Codolio's 565 active days with a GitHub-derived ~143, so the two
# jobs silently overwrote each other. They are now one workflow running one
# script, which pushes once and cannot race itself.
on:
  schedule:
    # Sundays 00:00 UTC (05:30 IST).
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Never let two runs push to the same branch at once.
  group: coding-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Writes public/codolio-stats.json (totals, rank, streak, active days),
      # public/github-contribs/<user>.json (heatmap) and
      # public/platform-stats.json. Any source that fails keeps its previous
      # committed values rather than writing an empty file.
      - name: Update all coding stats
        run: node scripts/update-coding-stats.mjs

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update coding stats [skip ci]"
          file_pattern: |
            public/codolio-stats.json
            public/github-contribs/*.json
            public/platform-stats.json